name: Build and Publish Release Binaries

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile C++ Backend DLL
      run: |
        cl /LD /EHsc Sudoku.cpp /Fe:Sudoku.dll

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish C# WPF App
      run: |
        dotnet publish SudokuWPF/SudokuWPF.csproj -c Release -r win-x64 --self-contained false -o publish_output

    - name: Package Executable, DLLs, and Release Zip
      shell: powershell
      run: |
        # Copy the compiled C++ backend DLL directly into the publish output folder
        Copy-Item Sudoku.dll -Destination publish_output\ -Force
        
        # Compress the complete publish folder into the final zip archive
        Compress-Archive -Path publish_output\* -DestinationPath SudokuApp-Windows.zip -Force

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: SudokuApp-Windows.zip
        tag_name: v1.0.${{ github.run_number }}
        name: "Sudoku App Build #${{ github.run_number }}"
        body: "Automated build containing SudokuWPF.exe, SudokuWPF.dll, and Sudoku.dll."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}